CONSTANTS
    Calls = {c1, c2, r1}
    Reports = {r1}
    MaxSleeps = 2
    MaxCrashes = 1
    UseTakeover = TRUE
    TakeDelivered = FALSE
    ResendDelivered = TRUE
    DurableOutbox = TRUE
    StableIds = TRUE
    AReturns = TRUE
