\* Must FAIL: B answers aborted without saving it (no durable fence), A takes the session back, a delayed commit lands.
CONSTANTS
    MaxFaults = 2
    PendingDurable = TRUE
    AbortRecords = FALSE
    FenceAborted = TRUE
    BLeftBefore = FALSE
    TimeoutKeepsLink = FALSE
    ClearOnResolve = TRUE
    RetryAbort = TRUE
SPECIFICATION SafetySpec
INVARIANTS
    AtMostOneRunnable
