[workspace]
resolver = "3"

[package]
name = "ompdesk-tauri-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
shell_core = { package = "ompdesk-shell", path = "../shell", default-features = false }

[build-dependencies]
tauri-build = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
