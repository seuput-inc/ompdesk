# The Rust toolchain for OMPdesk's own workspace (native/ompdesk), installed one way for every job that compiles it:
# the install action on a native-binaries cache miss and the native-check action. The channel is the one
# native/ompdesk/rust-toolchain.toml pins, so a toolchain bump there is the only edit; rustfmt and clippy come with it,
# and Swatinem/rust-cache keeps the workspace's build per job, OS and toolchain.
name: OMPdesk's Rust toolchain
description: The toolchain native/ompdesk/rust-toolchain.toml pins, with requested components and the workspace's cargo cache.

inputs:
  workspaces:
    description: "The cargo workspace Swatinem/rust-cache keeps: native/ompdesk, or native/ompdesk/crates/shell for the CEF shell."
    default: native/ompdesk
  components:
    description: Rust components to prepare before compiling.
    default: rustfmt, clippy

runs:
  using: composite
  steps:
    - name: Rust channel from native/ompdesk/rust-toolchain.toml
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' native/ompdesk/rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error file=native/ompdesk/rust-toolchain.toml::no channel; update .github/actions/native-toolchain"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}
