# The checks of OMPdesk's own Rust workspace (native/ompdesk), the same commands on every OS: ci.yml's and release.yml's
# `native` jobs run it on Linux, Windows and macOS arm64, because much of the core is platform code (sys.rs, spawn and
# kill, paths, file events) that only that OS compiles and runs. Formatting does not depend on the OS, so it runs on
# Linux alone. clippy and the tests each run even when the step before them failed, so one red step never hides another.
name: Check OMPdesk's Rust
description: cargo fmt (Linux), clippy with warnings denied and the workspace's tests, in native/ompdesk.

inputs:
  test-cache-key:
    description: "Exact key for rustc's test compilation state. Empty keeps the dependency-only cache."
    default: ""
outputs:
  unsaved-test-cache-key:
    description: "Key the caller may save after the tests pass on a miss."
    value: ${{ steps.test-cache.outputs.cache-hit != 'true' && inputs.test-cache-key || '' }}

runs:
  using: composite
  steps:
    - id: toolchain
      uses: ./.github/actions/native-toolchain

    - name: cargo fmt
      if: runner.os == 'Linux'
      shell: bash
      working-directory: native/ompdesk
      run: cargo fmt --all --check

    - name: cargo clippy
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      shell: bash
      working-directory: native/ompdesk
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

    # rust-cache restores dependencies but drops workspace crates. Keep only rustc's incremental state,
    # never Cargo fingerprints, linked executables or test results. Cargo still builds and runs every test.
    - id: test-cache
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && inputs.test-cache-key != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: native/ompdesk/target/debug/incremental
        key: ${{ inputs.test-cache-key }}

    - name: cargo test
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      shell: bash
      working-directory: native/ompdesk
      env:
        CARGO_INCREMENTAL: ${{ inputs.test-cache-key != '' && '1' || '0' }}
      run: cargo test --locked --workspace
