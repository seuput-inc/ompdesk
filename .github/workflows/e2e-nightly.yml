# The full Playwright suite, informational: nightly on main and on demand. It is
# no longer part of a release (release.yml runs @smoke on mac and win and
# real-core on mac); a failing shard here is a bug to fix, never a release block.
# The shards need the app bundle, built once on Linux (byte-identical on every OS).
#
# After a fix, check only the failing files (one shard, ~1 min of setup plus their own time, instead of ~25 min):
#   gh workflow run e2e-nightly.yml --ref main -f specs="e2e/a.e2e.ts e2e/b.e2e.ts"
# A targeted run has its own concurrency group, so it never cancels a full run (and a full run never cancels it).
#
# The parity sheet of a UI change, on a runner (a machine that must not run it, or one without a second app to pair):
#   gh workflow run e2e-nightly.yml --ref <branch> -f parity="settings-device-switch"
#   gh run download <run-id> -n parity   # <dir>/<surface>/{local,remote,phone,sheet}.png and parity.json
#   gh workflow run e2e-nightly.yml --ref <branch> -f parity="--both-orders"   # the order check: one runner per order,
#   gh run download <run-id> -n parity-forward -n parity-reverse                 # <dir>/forward and <dir>/reverse
#
# Every job here is a Windows runner (the suite builds on Linux): Playwright drives the Tauri host's page through
# WebView2's DevTools port and cannot attach to macOS's WKWebView (e2e/fixture/shell-launch.ts; macOS is checked by
# the native smoke in mac-checks.yml and release.yml), so no job here takes a macOS runner.
# A dispatch whose commit already has a green run with the same inputs cancels itself (queue-gate.yml) unless it passes
# `-f force=true`. See .omp/rules/e2e-ci-windows.md › CI › The check queue.
name: e2e-nightly
run-name: ${{ github.event_name == 'schedule' && 'e2e-nightly' || inputs.parity && format('parity [{0}] {1}', inputs.parity, inputs.fake-env) || inputs.specs && format('e2e [{0}]', inputs.specs) || 'e2e-nightly [full]' }}

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description: "Space-separated e2e spec files to run alone (empty: the whole suite)"
        type: string
        default: ""
      parity:
        description: "Parity surface ids, --both-orders, or --shipped for the v0.152.0/v0.153.0 Windows capture pair"
        type: string
        default: ""
      fake-env:
        description: "Space-separated OMP_GUI_*=value variables the parity capture starts the fake omp with (e.g. OMP_GUI_TEST_USAGE_ACCOUNTS=many)"
        type: string
        default: ""
      force:
        description: "Run even when this commit already has a green run with these inputs (otherwise the run cancels itself)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}-${{ inputs.parity == '--shipped' && 'shipped' || inputs.parity && 'parity' || inputs.specs && 'specs' || 'full' }}
  cancel-in-progress: true

jobs:
  # The queue's admission point (queue-gate.yml): skipped on the nightly, which has nothing to admit.
  gate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write # cancels this run when its commit is already green
    uses: ./.github/workflows/queue-gate.yml
    with:
      workflow: e2e-nightly.yml
      force: ${{ inputs.force }}

  build-out:
    needs: gate
    if: ${{ !cancelled() && inputs.parity != '--shipped' && (github.event_name == 'schedule' || needs.gate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          if-no-files-found: error
          retention-days: 1

  # A cold run compiled the same Windows binaries on every shard. Fill the shards' exact
  # native and test-automation cache keys once, while Linux builds out/.
  windows-host:
    needs: gate
    if: ${{ !cancelled() && !inputs.specs && !inputs.parity && (github.event_name == 'schedule' || needs.gate.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
        with:
          electron: "false"
          native: "true"
      - uses: ./.github/actions/tauri-shell
        with:
          test-automation: "true"

  e2e:
    needs: [build-out, windows-host]
    if: ${{ !cancelled() && !inputs.parity && needs.build-out.result == 'success' && (inputs.specs != '' || needs.windows-host.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-shards.yml
    with:
      specs: ${{ inputs.specs || '' }}

  shipped-before:
    if: inputs.parity == '--shipped'
    needs: gate
    uses: ./.github/workflows/shipped-capture.yml
    with:
      tag: v0.152.0

  shipped-after:
    if: ${{ !cancelled() && inputs.parity == '--shipped' && needs.gate.result == 'success' }}
    needs: [gate, shipped-before]
    uses: ./.github/workflows/shipped-capture.yml
    with:
      tag: v0.153.0

  shipped-report:
    if: ${{ !cancelled() && inputs.parity == '--shipped' && needs.gate.result == 'success' }}
    needs: [gate, shipped-before, shipped-after]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shipped-v*
          path: evidence
      - name: Compare tagged captures
        run: node scripts/shipped-capture-report.mjs evidence
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipped-comparison
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  # The parity sheet (e2e/parity.e2e.ts, what `bun run parity` runs after its own build) of the named surfaces on a
  # Windows runner, against the bundle build-out made. Uploaded whether it passed or not: the e2e shards keep their
  # captures of a failed run only. The order check runs each order on a runner of its own: a runner has one Playwright
  # worker, so both orders ran in turn, 17 to 26 min of capture after about 10 min of setup (25-26 Nov 2026), and run
  # 45798443670 hit the 45 min timeout mid-capture.
  parity:
    name: ${{ matrix.order == 'named' && 'parity' || format('parity ({0})', matrix.order) }}
    if: ${{ inputs.parity != '' && inputs.parity != '--shipped' }}
    needs: build-out
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: ${{ fromJSON(inputs.parity == '--both-orders' && '["forward","reverse"]' || '["named"]') }}
    defaults:
      run:
        shell: bash
    env:
      SURFACES: ${{ inputs.parity }}
      FAKE_ENV: ${{ inputs.fake-env }}
      ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      # The Tauri host (WebView2) and the pinned Node the parity capture launches (the tauri-shell action: a cached build),
      # built with test-automation: only that build leaves WebView2's DevTools port open for Playwright.
      - uses: ./.github/actions/tauri-shell
        with:
          test-automation: "true"
      # The unpackaged host finds Preview's browser under resources/preview-browser/<platform>-<arch>.
      - name: Stage the Preview browser
        run: bun scripts/stage-preview-browser.ts
      # The fake omp's terminals and search run stock's natives from the installed omp (e2e/remote-harness.ts).
      - uses: ./.github/actions/install-omp
      # The phone's page runs in Playwright's own Chromium, which a fresh runner lacks.
      - name: Playwright browsers
        run: bunx playwright install chromium webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out
      - name: Capture
        run: |
          set -euo pipefail
          # A Windows path for the Windows bun: Git Bash would hand it a /d/a/... one.
          PARITY_OUT=$(cygpath -m "$PWD/parity-out")
          if [ "$SURFACES" = "--both-orders" ]; then
            # The order check (scripts/parity.ts --both-orders): this runner's order of every surface, into
            # parity-out/forward or parity-out/reverse.
            OMP_GUI_PARITY="$PARITY_OUT" OMP_GUI_PARITY_ORDERS=both \
              bunx playwright test e2e/parity.e2e.ts --grep "parity sheet, $ORDER:" --trace off --reporter line \
              --output parity-out/results
            exit 0
          fi
          read -r -a IDS <<< "${SURFACES//,/ }"
          test "${#IDS[@]}" -gt 0
          for id in "${IDS[@]}"; do
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "::error::not a surface id: $id"; exit 1; }
          done
          ONLY=$(IFS=,; echo "${IDS[*]}")
          for pair in $FAKE_ENV; do
            [[ "$pair" =~ ^OMP_GUI_[A-Z0-9_]+=[A-Za-z0-9_.,-]*$ ]] || { echo "::error::not an OMP_GUI_ variable: $pair"; exit 1; }
            export "$pair"
          done
          OMP_GUI_PARITY="$PARITY_OUT" OMP_GUI_PARITY_ONLY="$ONLY" \
            bunx playwright test e2e/parity.e2e.ts --trace off --reporter line --output parity-out/results
      # Also after the job's timeout: what a cut-off capture had written shows how far it got.
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.order == 'named' && 'parity' || format('parity-{0}', matrix.order) }}
          path: parity-out/
          if-no-files-found: ignore
          retention-days: 7
