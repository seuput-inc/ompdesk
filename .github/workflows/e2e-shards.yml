# The full Playwright suite on GitHub's Windows runners, split over a matrix of
# shards and run against the `out/` bundle another job of the same run uploaded.
# Called by e2e-nightly.yml and by ci.yml's manual `e2e=true`, each after its
# own `build-out` job; release.yml no longer calls it. It never runs on its own.
#
# Windows because that is where Playwright can drive the app: the Tauri host's page is WebView2, which opens a
# DevTools port for the test child (e2e/fixture/shell-launch.ts). macOS's WKWebView has no CDP endpoint, so no
# Playwright spec can launch the app there; macOS is checked by `scripts/tauri-native-smoke.ts` (mac-checks.yml's
# `mac-smoke`, release.yml's `mac`). The staged host (resources/ompdesk-tauri/win32-x64) runs the built `out/` as an
# unpackaged app, as the harness always did; Preview's own browser is staged beside it.
#
# On runs 44970103705 and 44971979122 the slowest of 18 shards spent 568 s and 588 s in test
# bodies. Dealing the same selectors and replaying their logged durations at 20 gave 434 s and
# 432 s. That excludes setup and queue time. A focused dispatch still uses one worker.
name: e2e-shards

on:
  workflow_call:
    inputs:
      out-artifact:
        description: "Name of this run's artifact that holds the built out/ bundle"
        type: string
        default: out
      specs:
        description: "Space-separated e2e spec files to run alone in one shard; empty runs the whole suite"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: Cookie I/O (shard ${{ matrix.shard }}/20)
    runs-on: windows-latest
    # Windows setup (install, the Tauri test host) takes about 20 minutes before Playwright's 35-minute global timeout.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 19]
    defaults:
      run:
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: "20"
      SPECS_INPUT: ${{ inputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      # The Tauri host (WebView2) and the pinned Node, which every e2e launches (the tauri-shell action: a cached build),
      # built with test-automation: only that build leaves WebView2's DevTools port open for Playwright.
      - uses: ./.github/actions/tauri-shell
        with:
          test-automation: "true"
      # Preview uses staged Brave; phone and web specs launch Playwright's headless Chromium or WebKit.
      - name: Prepare Preview and Playwright browsers
        run: |
          bun scripts/stage-preview-browser.ts &
          preview=$!
          status=0
          bunx playwright install --only-shell chromium webkit || status=$?
          wait "$preview" || status=$?
          exit "$status"
      # The runner is ephemeral: real-core and deep-audit run the real omp.
      - uses: ./.github/actions/install-omp
      # The bundle is the same bytes whichever OS built it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.out-artifact }}
          path: out
      - name: Prepare isolated WebView2 observation folders
        shell: pwsh
        env:
          PROBE_RUNNER: ${{ runner.environment }}
        run: |
          $private = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/nav-private"
          $stages = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/nav-stages"
          "OMPDESK_NAV_PRIVATE=$($private.FullName)" >> $env:GITHUB_ENV
          "OMPDESK_NAV_STAGES=$($stages.FullName)" >> $env:GITHUB_ENV
          if ($env:PROBE_RUNNER -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          "RUNNER_ENVIRONMENT=$env:PROBE_RUNNER" >> $env:GITHUB_ENV
          "OMP_GUI_TEST_FIRST_NAV_NET=default" >> $env:GITHUB_ENV
      - name: List the original shard workload before tracing starts
        run: |
          bun scripts/e2e-shard.ts "$SHARD/$SHARDS" > "$RUNNER_TEMP/e2e-shard.txt"
          test -s "$RUNNER_TEMP/e2e-shard.txt"
      - name: Start WebView2 process timeline
        id: process_trace
        shell: pwsh
        run: ./scripts/nav-process.ps1 start
      - name: Start synthetic cookie file I/O measurements
        id: file_io
        shell: pwsh
        run: ./scripts/nav-cookie-io.ps1 start
      - name: Start Defender performance observation
        id: defender
        shell: pwsh
        run: ./scripts/nav-defender.ps1 start
      - name: Playwright, this shard's spec files
        run: bunx playwright test --global-timeout=2100000 --test-list "$RUNNER_TEMP/e2e-shard.txt"
      - name: Stop both recorders before decoding either trace
        if: always()
        env:
          FILE_STARTED: ${{ steps.file_io.outcome }}
          DEFENDER_STARTED: ${{ steps.defender.outcome }}
        run: |
          pids=()
          if [[ "$FILE_STARTED" == success ]]; then pwsh -File scripts/nav-cookie-io.ps1 stop & pids+=($!); fi
          if [[ "$DEFENDER_STARTED" == success ]]; then pwsh -File scripts/nav-defender.ps1 stop & pids+=($!); fi
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=$?; done
          exit "$status"
      - name: Finish WebView2 process timeline
        if: ${{ always() && steps.process_trace.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/nav-process.ps1 stop
      - name: Correlate first navigations with network stages
        if: ${{ always() && env.OMPDESK_NAV_STAGES != '' }}
        run: bun scripts/nav-stages.ts
      - name: Upload only the sanitized timelines, including passing shards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nav-stages-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/nav-stages/navigation.jsonl
            ${{ runner.temp }}/nav-stages/process-timeline.jsonl
            ${{ runner.temp }}/nav-stages/cookie-io.jsonl
            ${{ runner.temp }}/nav-stages/defender-cost.jsonl
          if-no-files-found: error
          retention-days: 3
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-windows-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
