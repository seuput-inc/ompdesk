# The full Playwright suite on GitHub's Windows runners, split over a matrix of
# shards and run against the `out/` bundle another job of the same run uploaded.
# Called by e2e-nightly.yml and by ci.yml's manual `e2e=true`, each after its
# own `build-out` job; release.yml no longer calls it. It never runs on its own.
#
# Windows because that is where Playwright can drive the app: the Tauri host's page is WebView2, which opens a
# DevTools port for the test child (e2e/fixture/shell-launch.ts). macOS's WKWebView has no CDP endpoint, so no
# Playwright spec can launch the app there; macOS is checked by `scripts/tauri-native-smoke.ts` (mac-checks.yml's
# `mac-smoke`, release.yml's `mac`). The staged host (resources/ompdesk-tauri/win32-x64) runs the built `out/` as an
# unpackaged app, as the harness always did; Preview's own browser is staged beside it.
#
# Sharding is scripts/e2e-shard.ts (whole spec files, dealt by estimated cost),
# not `playwright test --shard`, which counts tests that skip inside their body
# and so leaves one shard nearly empty. Every shard runs against the real latest
# omp (real-core and deep-audit) and the fake omp (everything else); playwright
# runs one worker per shard (2-core runner; playwright.config.ts).
#
# Five shards, as when the suite ran on macOS (where a public repo runs at most 5 jobs at once; Windows has no such
# cap, so more is possible). `scripts/e2e-shard-costs.json` was measured on macOS runners, so the deal is an estimate
# until `bun scripts/e2e-shard-costs.ts <run-id>` rewrites it from a Windows run. Playwright's `--global-timeout` is 35
# minutes under the job's 40, so a shard that runs long still prints its failures and uploads `test-results/` (the
# upload also runs on a cancel), though the tests left do not run. `fail-fast: false`: one run reports every failing
# shard, and `gh run rerun <id> --failed` reruns only those.
#
# One worker per shard: on macOS, two workers failed load-sensitive tests that pass with one (run 42693732758:
# `preview-stream`'s frame pacing, every time). Two workers need those made independent of load first.
#
# `specs` (space-separated e2e/*.e2e.ts paths) runs those files alone in one shard instead of the whole suite: the
# check after a fix, at the cost of the files plus ~1 min of setup, not ~25 min (e2e-nightly.yml's dispatch input).
name: e2e-shards

on:
  workflow_call:
    inputs:
      out-artifact:
        description: "Name of this run's artifact that holds the built out/ bundle"
        type: string
        default: out
      specs:
        description: "Space-separated e2e spec files to run alone in one shard; empty runs the whole suite"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    # Windows setup (install, the Tauri test host) takes about 20 minutes before Playwright's 35-minute global timeout.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.specs != '' && '[1]' || '[1, 2, 3, 4, 5]') }}
    defaults:
      run:
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
      SPECS_INPUT: ${{ inputs.specs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      # The Tauri host (WebView2) and the pinned Node, which every e2e launches (the tauri-shell action: a cached build),
      # built with test-automation: only that build leaves WebView2's DevTools port open for Playwright.
      - uses: ./.github/actions/tauri-shell
        with:
          test-automation: "true"
      # The unpackaged host finds Preview's browser under resources/preview-browser/<platform>-<arch>.
      - name: Stage the Preview browser
        run: bun scripts/stage-preview-browser.ts
      # The runner is ephemeral: real-core and deep-audit run the real omp.
      - uses: ./.github/actions/install-omp
      # mobile-*.e2e.ts drive the web build in Playwright's own browsers, which a fresh runner lacks.
      - name: Playwright browsers
        run: bunx playwright install chromium webkit
      # The bundle is the same bytes whichever OS built it.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.out-artifact }}
          path: out
      - name: Playwright, this shard's spec files
        run: |
          set -euo pipefail
          if [ -n "$SPECS_INPUT" ]; then
            read -r -a SPECS <<< "$SPECS_INPUT"
            # Only existing spec files: a typo must fail here, not match nothing or (as a Playwright regex) more.
            for spec in "${SPECS[@]}"; do
              [[ "$spec" =~ ^e2e/[A-Za-z0-9._/-]+\.e2e\.ts$ && -f "$spec" ]] || { echo "::error::not an e2e spec file: $spec"; exit 1; }
            done
          else
            # A failed listing must stop here: an empty list would run every spec.
            FILES=$(bun scripts/e2e-shard.ts "$SHARD/$SHARDS")
            read -r -a SPECS <<< "$FILES"
          fi
          test "${#SPECS[@]}" -gt 0
          # Playwright stops itself 5 minutes before the job's limit, so a shard that runs long still prints every
          # failure and leaves its traces (nightly 39749113072: shard 2 hit 30 minutes and its one failure left nothing).
          bunx playwright test --global-timeout=2100000 "${SPECS[@]}"
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
