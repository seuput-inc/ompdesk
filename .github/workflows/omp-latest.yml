# Daily vitest against the newest published omp, so an omp release that breaks
# what OMPdesk reads from the installed stock omp (its settings and their
# Korean copy, provider ids, tool renderers, the `*-stock` bridge suites) shows
# the day it is published, even with no push to main. ci.yml, the e2e runs and
# release.yml install the tested omp (src/shared/omp-tested.json, through
# .github/actions/install-omp), so only this workflow meets a newer one first.
# Their Windows job (`win-platform`) installs none, so the stock suites skip
# there; the `windows` job here runs `test:platform` with omp installed, so a
# stock suite that fails only on Windows (a file a live worker still holds, a
# picture Bun reads only through the OS) shows within a day.
# `plan` reads npm's newest omp once; every job installs exactly that version.
# While it fails on main, one issue ("Tests against the latest omp failed")
# stays open with the omp version and the run; a passing run on main closes it.
# A run from another ref only tests and touches no issue.
#
# The bump path (W5 of the omp boundary work), on main when the newest omp is
# newer than the tested one (scripts/omp-bump/latest-run.ts):
# - every vitest job writes vitest's JSON report and fails on a `*-stock` test
#   that skipped with omp installed, unless EXPECTED_STOCK_SKIPS names why;
# - `strings` runs `scripts/omp-bump/extract.ts --check` and keeps the full
#   diff as the `omp-bump` artifact;
# - all green: `push` puts branch omp/bump/<version> (only omp-tested.json
#   changed) and one issue "omp <version> is ready to become the tested version"
#   carries its compare link and the ci-run.ts line its CI needs (a GITHUB_TOKEN
#   push starts no workflow; no pull request is opened, the repository does not
#   let Actions open one). The issue closes once omp-tested.json reaches that
#   version on main, or a newer version's issue replaces it;
# - anything red: the failure issue lists the failed and skipped test files
#   under the touchpoints whose tests name them (scripts/omp-boundary/
#   touchpoints.ts), unlisted files apart, and the missing strings.
# A version whose branch exists is tested again but pushes and opens nothing.
#
# Run it now: gh workflow run omp-latest.yml [--ref <branch>]
# Rehearse the bump path from any ref: add -f pretend_tested=<older X.Y.Z>; it
# pushes the branch and opens the ready issue (delete both after), never
# touches the failure issue.
name: omp-latest

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      pretend_tested:
        description: "Rehearsal only: treat this X.Y.Z as the tested omp, so this ref takes the bump path"
        default: ""

permissions:
  contents: read

concurrency:
  group: omp-latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.plan.outputs.latest }}
      tested: ${{ steps.plan.outputs.tested }}
      bump: ${{ steps.plan.outputs.bump }}
      fresh: ${{ steps.plan.outputs.fresh }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - id: plan
        env:
          PRETEND_TESTED: ${{ inputs.pretend_tested }}
        run: |
          LATEST=$(npm view @oh-my-pi/pi-coding-agent version) bun scripts/omp-bump/latest.ts plan

  check:
    name: check (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    outputs:
      omp: ${{ steps.omp.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node 1/2
            id: node-1
            args: --project=node --shard=1/2
          - name: node 2/2
            id: node-2
            args: --project=node --shard=2/2
          - name: renderer 1/2
            id: renderer-1
            args: --project=renderer --shard=1/2
          - name: renderer 2/2
            id: renderer-2
            args: --project=renderer --shard=2/2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
      - id: omp
        uses: ./.github/actions/install-omp
        with:
          version: ${{ needs.plan.outputs.latest }}
      - id: vitest
        run: bunx vitest run ${{ matrix.args }} ${{ needs.plan.outputs.bump == 'true' && '--reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-report.json' || '' }}
      - name: Stock tests that skipped
        if: ${{ !cancelled() && needs.plan.outputs.bump == 'true' }}
        env:
          GROUP: check
          JOB: ${{ matrix.id }}
          OUTCOME: ${{ steps.vitest.outcome }}
        run: bun scripts/omp-bump/latest.ts summary vitest-report.json "$RUNNER_TEMP/vitest/${{ matrix.id }}.summary.json"
      - if: ${{ !cancelled() && needs.plan.outputs.bump == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-${{ matrix.id }}
          path: ${{ runner.temp }}/vitest
          retention-days: 14
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      - uses: ./.github/actions/install-omp
        with:
          version: ${{ needs.plan.outputs.latest }}
      - id: vitest
        run: bun run test:platform ${{ needs.plan.outputs.bump == 'true' && '--reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-report.json' || '' }}
      - name: Stock tests that skipped
        if: ${{ !cancelled() && needs.plan.outputs.bump == 'true' }}
        env:
          GROUP: windows
          JOB: windows
          OUTCOME: ${{ steps.vitest.outcome }}
        run: bun scripts/omp-bump/latest.ts summary vitest-report.json "$RUNNER_TEMP/vitest/windows.summary.json"
      - if: ${{ !cancelled() && needs.plan.outputs.bump == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-windows
          path: ${{ runner.temp }}/vitest
          retention-days: 14
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  strings:
    needs: plan
    if: needs.plan.outputs.bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - uses: ./.github/actions/install-omp
        with:
          version: ${{ needs.plan.outputs.latest }}
      - name: Strings the dictionaries lack
        env:
          OUT: ${{ runner.temp }}/omp-bump
        run: |
          mkdir -p "$OUT"
          bun scripts/omp-bump/extract.ts > "$OUT/omp-bump.json"
          bun scripts/omp-bump/extract.ts --check > "$OUT/strings-check.txt" 2>&1 || { cat "$OUT/strings-check.txt"; exit 1; }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-bump
          path: ${{ runner.temp }}/omp-bump
          retention-days: 30
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  push:
    needs: [plan, check, windows, strings]
    if: needs.plan.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the omp/bump/<version> branch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          VERSION: ${{ needs.plan.outputs.latest }}
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          jq --tab --arg v "$VERSION" '.version = $v' src/shared/omp-tested.json > "$RUNNER_TEMP/omp-tested.json"
          mv "$RUNNER_TEMP/omp-tested.json" src/shared/omp-tested.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A rehearsal (pretend_tested) on a ref already at this version has nothing to change.
          git commit --allow-empty -m "chore(omp): test against omp $VERSION" src/shared/omp-tested.json
          git push origin "HEAD:refs/heads/$BRANCH"

  issue:
    needs: [plan, check, windows, strings, push]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      RESULT: ${{ needs.plan.result == 'success' && needs.check.result == 'success' && needs.windows.result == 'success' && needs.strings.result != 'failure' && 'success' || 'failure' }}
      OMP: ${{ needs.check.outputs.omp }}
    steps:
      - if: needs.plan.outputs.bump == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: needs.plan.outputs.bump == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: needs.plan.outputs.bump == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        # A run whose jobs ended before uploading leaves nothing to download; the report still names them.
        continue-on-error: true
        with:
          pattern: "{vitest-*,omp-bump}"
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Failures by touchpoint
        if: needs.plan.outputs.bump == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.latest }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          bun scripts/omp-bump/latest.ts report "$RUNNER_TEMP/results" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Failure issue
        if: github.ref == 'refs/heads/main' && inputs.pretend_tested == ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const title = "Tests against the latest omp failed";
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const omp = process.env.OMP || "omp (version not read)";
            const failed = process.env.RESULT !== "success";
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: failed ? "all" : "open", per_page: 100 });
            const existing = issues.filter(issue => !issue.pull_request && issue.title === title);
            if (failed) {
              const report = `${process.env.RUNNER_TEMP}/report.md`;
              const body = [
                `vitest failed on main against ${omp}: ${run}`,
                "",
                "Each failing job's summary names its first errors. A stock test that broke is OMPdesk catching up with this omp (settings copy, provider marks, a bridge internal), never a test to skip.",
                ...(fs.existsSync(report) ? ["", fs.readFileSync(report, "utf8")] : []),
              ].join("\n");
              if (existing[0]) {
                await github.rest.issues.update({ owner, repo, issue_number: existing[0].number, body, state: "open" });
                core.info(`Updated #${existing[0].number}`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.info(`Opened #${created.data.number}`);
              }
              return;
            }
            for (const issue of existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Passing again against ${omp}: ${run}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }
      - name: Ready issue
        if: github.ref == 'refs/heads/main' || inputs.pretend_tested != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUSHED: ${{ needs.push.result }}
          VERSION: ${{ needs.plan.outputs.latest }}
          TESTED: ${{ needs.plan.outputs.tested }}
          BRANCH: ${{ needs.plan.outputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { PUSHED, VERSION, TESTED, BRANCH } = process.env;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const titleOf = version => `omp ${version} is ready to become the tested version`;
            const pattern = /^omp (\d+\.\d+\.\d+) is ready to become the tested version$/;
            const order = (a, b) => {
              const [x, y] = [a, b].map(v => v.split(".").map(Number));
              return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
            };
            const pushed = PUSHED === "success";
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 }))
              .filter(issue => !issue.pull_request && pattern.test(issue.title));
            for (const issue of open) {
              const version = pattern.exec(issue.title)[1];
              const reason = order(version, TESTED) <= 0
                ? `src/shared/omp-tested.json is at ${TESTED} on main.`
                : pushed && order(version, VERSION) < 0 ? `omp ${VERSION} replaces it: ${run}` : null;
              if (!reason) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: reason });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              core.info(`Closed #${issue.number}: ${reason}`);
            }
            if (!pushed) return;
            const body = [
              `Every check of omp-latest passed against omp ${VERSION} (tested: ${TESTED}): ${run}`,
              "",
              `Branch \`${BRANCH}\` changes only \`src/shared/omp-tested.json\`. Its push came from the workflow's token, which starts no workflow, so dispatch CI on it:`,
              "",
              "```sh",
              `bun scripts/ci-run.ts ci --ref ${BRANCH} -f batch=true`,
              "```",
              "",
              `Then open the pull request: ${context.serverUrl}/${owner}/${repo}/compare/main...${BRANCH}?expand=1`,
              "",
              "This issue closes when omp-tested.json reaches this version on main.",
            ].join("\n");
            const same = open.find(issue => issue.title === titleOf(VERSION) && issue.state === "open");
            if (same) {
              await github.rest.issues.update({ owner, repo, issue_number: same.number, body });
              core.info(`Updated #${same.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title: titleOf(VERSION), body });
              core.info(`Opened #${created.data.number}`);
            }
