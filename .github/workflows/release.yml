# Pushing a `package.json` version bump to main releases it: when tag
# `v<version>` does not exist yet and CHANGELOG.md has a dated
# `## [<version>] - YYYY-MM-DD` section, this runs the checks, packages macOS
# (arm64) and Windows (x64), launches each fresh build, and only when all of
# that passed creates the tag and the GitHub Release: the changelog section as
# notes, and exactly two assets, `ompdesk-mac-arm64.dmg` and
# `ompdesk-windows-setup.exe`. The in-app updater reads their version, size and
# SHA-512 from an HTML comment the publish job appends to the notes
# (`<!-- ompdesk-update {json} -->`, parsed by src/main/update-release.ts).
# An `Unreleased` heading or an existing tag makes the run a no-op.
# `workflow_dispatch` re-runs it; `dry_run` does everything except the tag and
# release (the packages stay as run artifacts) and works on any branch.
#
# Layout: the repo is public, so hosted runners are free and every job runs on
# one (Linux, macOS arm64, Windows). This is the whole release gate (what
# `bun run gate` runs locally), all of it starting right after `prepare`:
# `build` builds the app bundle (`out/`) once and uploads it; `static` runs
# types, biome and the surface policy; `check` runs vitest as four jobs (the
# node and renderer projects in two shards each); `win-platform` runs the
# tests outside src/renderer on Windows in three shards; `native` checks
# OMPdesk's own Rust (fmt, clippy, `cargo test`) on Linux, Windows and macOS
# arm64 and `mac-native` runs the vitest files that drive its real binary on
# macOS; `win` and `mac` install meanwhile,
# wait for build's out/ in this run's artifacts, package it and launch the
# result (the packaged Tauri app, driven through its native WebDriver by scripts/tauri-native-smoke.ts); `publish` runs only
# when all of them passed. The full Playwright suite is not part of a release
# (e2e-nightly.yml runs it informationally). A failed job writes its first error
# lines to its job summary at once (scripts/ci-failure.sh). After a flaky
# failure, rerun only the failed jobs: `gh run rerun <id> --failed`.
#
# Trust: this workflow starts only from a push to main that touches
# package.json or from a manual dispatch (write access), never from a pull
# request. Every job has a read-only token except `publish` (contents: write),
# and the signing secrets are read by the `mac` Package step alone. Every
# action is pinned to a commit.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not create the tag or release"
        type: boolean
        default: false

# A later push never cancels a release run: a push that touches package.json
# while one is going waits for it, so no run stops half way through `publish`.
# The waiting run then finds the tag cut and ends after `prepare`, or releases
# the newer version; a newer waiting run replaces an older waiting one.
# Failed jobs never cancel their independent siblings: `gh run rerun --failed`
# then reruns only what failed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # mac signing is scripts/mac-sign.cjs with OMPdesk's pinned self-signed
  # certificate (repository secrets below); never look for a keychain
  # certificate or publish from electron-builder itself.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Transition switch. Installed apps up to v0.17.x update from
  # electron-updater's `latest-mac.yml` / `latest.yml` and fetch the files those
  # name by exact name: `ompdesk-<v>-arm64-mac.zip` (relaunch mode),
  # `ompdesk-<v>-arm64.dmg` (manual mode), `ompdesk-<v>-setup.exe` (Windows).
  # "true" adds that feed and those files to the release, so such installs
  # update once into the new updater. v0.18.0 shipped it on; it is off since
  # v0.18.1, so releases carry exactly the two assets.
  LEGACY_UPDATE_FEED: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: meta
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          V=$(jq -r .version package.json)
          TAG="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::notice::$TAG already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$TAG already exists (dry run continues)."
          fi

          HEADING=$(awk -v h="## [$V]" 'index($0, h) == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error file=CHANGELOG.md::No '## [$V]' section in CHANGELOG.md; write it before releasing $TAG."
            exit 1
          fi
          if [[ "$HEADING" == *Unreleased* && "$DRY_RUN" != "true" ]]; then
            echo "::notice::CHANGELOG.md still marks $V as Unreleased; date the heading to release $TAG."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only (got $GITHUB_REF); use dry_run on other branches."
            exit 1
          fi

          mkdir -p notes
          # Korean first, then the English summary after a rule: the `<!-- en -->` marker line becomes `---`.
          awk -v h="## [$V]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f && $0 == "<!-- en -->" { print "---"; next } f' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error file=CHANGELOG.md::The '## [$V]' section in CHANGELOG.md is empty."
            exit 1
          fi
          MIN_OMP=$(sed -n 's/^export const MIN_OMP_VERSION = "\(.*\)";$/\1/p' src/main/omp-runtime.ts)
          if [ -z "$MIN_OMP" ]; then
            echo "::error file=src/main/omp-runtime.ts::MIN_OMP_VERSION not found."
            exit 1
          fi
          # shellcheck disable=SC2016 # literal backticks are Markdown
          printf '\n---\n\nRequires omp **%s** or newer (`omp update`).\n' "$MIN_OMP" >> notes/notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The app bundle (`out/`) is the same bytes whichever OS builds it (out/
  # built on Linux, macOS and Windows diffed identical), so it is built once,
  # right after `prepare`, and `mac` and `win` package that instead of building
  # their own (about 40 s of each critical path). Nothing else runs in this
  # job.
  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Nothing here launches Electron, and `win` and `mac` wait on this job's
      # upload, so it does nothing else: types, biome and the surface policy
      # are `static`'s, vitest is `check`'s.
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out
          path: out/
          if-no-files-found: error
          retention-days: 1
          # A rerun of a failed job below uploads it again.
          overwrite: true
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Types, biome and the surface policy: a blocking gate that needs no out/,
  # so it runs beside build instead of delaying build's end.
  static:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run check:types
      - run: bunx biome check src e2e resources scripts
      - run: node scripts/lint-surfaces.mjs
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # vitest on four runners at once, off every other job: the node and renderer
  # projects in two halves each (the full suite in one job took 176 s on a
  # 2-core host; the renderer project is most of it; the stock suites on the
  # newest omp, as in ci.yml's `check`, add half again to the node project). `publish`
  # waits for every one of them.
  check:
    name: check (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node 1/2
            args: --project=node --shard=1/2
          - name: node 2/2
            args: --project=node --shard=2/2
          - name: renderer 1/2
            args: --project=renderer --shard=1/2
          - name: renderer 2/2
            args: --project=renderer --shard=2/2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Tests import electron, whose index.js throws without the binary; the shared install fetches it
      # (cached by electron's version, one retry on a download miss).
      - uses: ./.github/actions/install
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bunx vitest run ${{ matrix.args }}
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Package, verify the bundle, then launch the build packaging just made: the packaged Tauri app on the fake omp
  # (scripts/tauri-native-smoke.ts; Playwright cannot drive WKWebView).
  mac:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read # lists this run's artifacts and jobs while `build` runs; the failure report reads the jobs
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # The shared install fetches Electron from a cache, and puts electron-builder's downloads in one for
      # Package below. bun runs lifecycle scripts with the `node` on PATH; where electron's extract-zip exits
      # mid-unzip without an error no binary is left, so the install unzips under bun.
      - uses: ./.github/actions/install
        with:
          builder: "true"
      # The Tauri host (system WebView), the rollback launcher and the pinned Node for the package (the tauri-shell action: a cached build).
      - uses: ./.github/actions/tauri-shell
      # The pinned, signed Brave runtime Preview browses with (resources/preview-browser.json); packaging verifies it.
      - name: Stage the Preview browser
        run: bun scripts/stage-preview-browser.ts
      # The memory binary is built from native/memory (OMPdesk's own source) right here, while the build job
      # produces out/: the upstream's release build (`cargo build --locked --release -p ai-memory-cli`, scripts/build-memory.ts)
      # puts the binary and its build record in the gitignored resources/ai-memory-bin/; after-pack fails the package without them.
      # Both are cached by everything that decides their bytes (native/memory with its Cargo.lock and rust-toolchain.toml,
      # scripts/build-memory.ts, and resources/gui-bridge/memory-prompt.ts and redactor.ts, which the CLI embeds with include_str! into the omp
      # extension it generates) per OS and arch: a hit skips the 7-9 min build, `--check` then recomputes the binary's
      # SHA-256 against the record and runs its --version, and after-pack checks the packaged bytes again. Saved right
      # after the build, so a later failing step still keeps it.
      - id: memory-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ai-memory-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/memory/**', 'scripts/build-memory.ts', 'resources/gui-bridge/memory-prompt.ts', 'resources/gui-bridge/redactor.ts') }}
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native/memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        name: Build the memory binary
        run: bun run build:memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ${{ steps.memory-cache.outputs.cache-primary-key }}
      - if: steps.memory-cache.outputs.cache-hit == 'true'
        name: Check the cached memory binary
        run: bun run build:memory -- --check
      # agent-desktop, the default computer-use engine, ships in the app at the release scripts/agent-desktop-pin.json
      # pins: downloaded from its GitHub release, checked against the pinned SHA-256 and the archive's exact files,
      # unpacked into the gitignored resources/agent-desktop-bin/ (about 4 MB, so no cache). after-pack fails the
      # package without it; mac.sign signs both binaries with the app.
      - name: Unpack the pinned agent-desktop
        run: bun run build:agent-desktop
      # Package build's out/ (the same bytes `win` uses), not
      # a second build: `needs: build` would start this job only after build's
      # run is over, and `bun run package:mac` would build again (a downloaded
      # out/ has other mtimes than build-cache.ts's stamp, so it never reuses).
      - name: Wait for out/ from the build job
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fetch-out.sh
      # The legacy feed also needs the ZIP (and the latest-mac.yml listing it).
      # A release must be signed with the pinned certificate: an ad-hoc
      # fallback would make macOS ask every user for its privacy permissions
      # again. Only a run on main gets the secrets and requires them; a dry run
      # from another branch (anyone with write access can start one and pick
      # the branch's code) packages ad-hoc, with no secret in reach, and only
      # proves the package builds and launches.
      - name: Package
        env:
          OMPDESK_MAC_SIGNING_P12_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.MAC_SIGNING_P12_BASE64 || '' }}
          OMPDESK_MAC_SIGNING_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_SIGNING_PASSWORD || '' }}
          OMPDESK_MAC_SIGNING_REQUIRED: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          set -euo pipefail
          # scripts/package-mac.ts assembles OMPdesk.app from the Tauri host and launcher, checks it (scripts/after-pack.cjs),
          # signs it inside out and calls electron-builder --prepackaged for the DMG only.
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            bun scripts/package-mac.ts --legacy-zip
          else
            bun scripts/package-mac.ts
          fi
      - name: Verify bundle
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/ompdesk-$V-arm64.dmg"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/OMPdesk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            SHA1=$(jq -r .certificateSha1 scripts/mac-signing.json)
            REQ=$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^designated => //p')
            if [ "$REQ" != "identifier \"com.seuput.ompdesk\" and certificate root = H\"$SHA1\"" ]; then
              echo "::error::OMPdesk.app is not signed with the pinned certificate: $REQ"
              exit 1
            fi
          else
            echo "::notice::$GITHUB_REF is not main: ad-hoc signed, pinned certificate not checked."
          fi
          test -f "$APP/Contents/Resources/gui-bridge/index.ts"
          AIM="$APP/Contents/Resources/ai-memory-bin/ai-memory"
          test -x "$AIM"
          codesign --verify --strict --verbose=2 "$AIM"
          # The requirement the app checks before staging it (src/main/ai-memory/service.ts AI_MEMORY_REQUIREMENT).
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            codesign --verify --strict -R "=identifier \"ai-memory\" and certificate root = H\"$SHA1\"" "$AIM"
          fi
          AIM_HOME=$(mktemp -d)
          HOME="$AIM_HOME" "$AIM" --version | grep -F "$(jq -r .version native/memory/ompdesk.json)"
          # The bundled agent-desktop (scripts/agent-desktop-pin.json): both binaries signed with the app, the CLI runs.
          ADT="$APP/Contents/Resources/agent-desktop-bin"
          for BIN in "$ADT/agent-desktop" "$ADT/agent-desktop-macos-helper"; do
            test -x "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
          done
          "$ADT/agent-desktop" --version | grep -Fx "agent-desktop $(jq -r .version scripts/agent-desktop-pin.json)"
          # OMPdesk's own Rust (native/ompdesk): the CLI carries the app's signature and runs.
          CLI="$APP/Contents/Resources/ompdesk-bin/ompdesk"
          test -x "$CLI"
          codesign --verify --strict --verbose=2 "$CLI"
          "$CLI" help | grep -F "Exit codes"
          # The core process starts, says ready and ends when its stdin does.
          CORE="$APP/Contents/Resources/ompdesk-bin/ompdesk-core"
          test -x "$CORE"
          codesign --verify --strict --verbose=2 "$CORE"
          "$CORE" < /dev/null | grep -F '"event":"ready"'
          # The Tauri host and the rollback launcher: the build record (Resources/ompdesk-tauri.build.json, the input
          # after-pack checked) names the host; the app's executable is the launcher. Each Mach-O carries the app's
          # signature (the `--deep --strict` above covers them; each is named here so a failure says which) and is arm64.
          REC="$APP/Contents/Resources/ompdesk-tauri.build.json"
          test "$(jq -r .engine "$REC")" = tauri
          test "$(jq -r .platform "$REC")" = darwin
          HOST="$APP/Contents/MacOS/$(jq -er .binary "$REC")"
          LAUNCHER="$APP/Contents/MacOS/OMPdesk"
          jq -er .launcher "$REC" >/dev/null
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = OMPdesk
          for BIN in "$HOST" "$LAUNCHER"; do
            test -x "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
            lipo -archs "$BIN" | grep -qx arm64
          done
          # No CEF anywhere: the system WebView is the engine.
          test ! -e "$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
          if compgen -G "$APP/Contents/Frameworks/OMPdesk Helper*.app" >/dev/null; then
            echo "::error::A CEF helper app remains in the Tauri package"
            exit 1
          fi
          test ! -e "$APP/Contents/Resources/LICENSE.cef.txt"
          test ! -e "$APP/Contents/Resources/LICENSES.chromium.html"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = com.seuput.ompdesk
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$APP/Contents/Info.plist" | grep -Fx omp
          # The oldest macOS it runs on (src/shared/app-compatibility.json, 14).
          MINOS=$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")
          test "$MINOS" = "$(jq -r .minimumMacOS src/shared/app-compatibility.json)"
          [[ "$MINOS" == 14.* ]]
          # Node (scripts/node-runtime-pin.json) runs the main from the plain app folder.
          NODE="$APP/Contents/Resources/node/node"
          test -x "$NODE"
          codesign --verify --strict --verbose=2 "$NODE"
          "$NODE" --version | grep -Fx "v$(jq -r .version scripts/node-runtime-pin.json)"
          test -f "$APP/Contents/Resources/app/out/main/index.js"
          test -f "$APP/Contents/Resources/app/out/preload/tauri.js"
          test ! -e "$APP/Contents/Resources/app/out/preload/shell.js"
          # Preview's own browser runtime (resources/preview-browser.json, bun scripts/stage-preview-browser.ts): its record
          # and the executable it names are in the package, signed like the rest.
          PB="$APP/Contents/Resources/preview-browser"
          test -f "$PB/runtime.json"
          PBBIN="$PB/$(jq -er .binary "$PB/runtime.json")"
          test -f "$PBBIN"
          codesign --verify --strict --verbose=2 "$PBBIN"
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      # Playwright cannot drive WKWebView: the actual packaged app is launched on a copy out of the DMG that ships and
      # driven through the test-only native WebDriver (the Node test inspector, a test profile and a port):
      # bridge, new tab, a prompt round trip on the fake omp, settings, a clean quit.
      - name: Smoke the packaged Tauri app
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/ompdesk-$V-arm64.dmg"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$RUNNER_TEMP/OMPdesk.app"
          ditto "$MNT/OMPdesk.app" "$APP"
          hdiutil detach "$MNT" -quiet
          trap - EXIT
          mkdir -p "$RUNNER_TEMP/tauri-smoke"
          export OMPDESK_TAURI_TEST_BINARY="$APP/Contents/MacOS/$(jq -er .binary "$APP/Contents/Resources/ompdesk-tauri.build.json")"
          export OMPDESK_TAURI_TEST_OUTPUT="$RUNNER_TEMP/tauri-smoke"
          export OMPDESK_TAURI_TEST_NODE="$APP/Contents/Resources/node/node"
          export OMP_GUI_E2E_OUT="$APP/Contents/Resources/app/out"
          bun scripts/tauri-native-smoke.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-smoke-macos
          path: ${{ runner.temp }}/tauri-smoke/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-arm64.dmg" release/ompdesk-mac-arm64.dmg
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest-mac.yml release/
            sed -n 's/^ *- url: //p' dist/latest-mac.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-arm64-mac.zip"
          fi
          ls -l release
      # The GitHub Release keeps these files; the run artifact only carries
      # them to `publish` (a dry run keeps them a week to download).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-mac
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # `bun run test:platform` is vitest on every test outside src/renderer
  # (paths, PATH lookup, cmd.exe shims, spawn, named pipes, file modes); the
  # renderer never sees the host OS and its tests run in `check`
  # (src/main/platform-test-scope.test.ts keeps host-platform checks out of
  # them). Its own Windows job: beside `win`'s packaging it took 132 s, and on
  # the same runner after the install it ended 2 minutes after out/ arrived,
  # holding `win` back. Three shards (vitest's `--shard`, dealt by measured cost,
  # scripts/vitest-sequencer.ts): one job took 432-535 s, the longest of the run, and
  # two took 287 and 309 s (ci run 42701060204) while every other job of a push
  # ended within 213 s, so the push still waited for Windows.
  win-platform:
    name: win-platform (${{ matrix.shard }}/3)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See `win`: bun's cache on the workspace volume; the Electron binary is
      # needed (gpu-fallback and sidecar tests import electron).
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      # Vitest starts the files that took longest last time first (its results cache): without it the
      # git-heavy files (disk care, autopilot) could start last and leave one worker alone at the end.
      - name: Restore vitest's file durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-win-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: vitest-results-win-${{ matrix.shard }}-
      - run: bun run test:platform --shard=${{ matrix.shard }}/3
      - name: Save vitest's file durations
        if: ${{ !cancelled() && hashFiles('node_modules/.vite/vitest/**/results.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-win-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # OMPdesk's Tauri shell and Preview consumer, the Rust that replaced the CEF shell (native/ompdesk/crates/tauri-shell and
  # shell-preview, workspaces of their own): compile the host, test it, fmt and clippy with warnings denied, refuse a CEF
  # dependency, on the two OSes that ship it; as shell-batch-checks.yml's `tauri-native`.
  tauri:
    name: tauri (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
          native: "false"
      - uses: ./.github/actions/native-toolchain
        with:
          workspaces: |
            native/ompdesk/crates/tauri-shell
            native/ompdesk/crates/shell-preview
      - name: Compile the actual system-WebView host
        shell: bash
        run: cargo build --locked --manifest-path native/ompdesk/crates/tauri-shell/Cargo.toml --bin ompdesk-tauri-shell
      - name: Test the host identity and page boundaries
        shell: bash
        run: cargo test --locked --manifest-path native/ompdesk/crates/tauri-shell/Cargo.toml
        env:
          OMPDESK_PROFILE_TEST_ROOT: ${{ runner.temp }}/ompdesk-profile
      - name: Exercise the real preload attachment and migration consumers
        shell: bash
        run: |
          set -euo pipefail
          bun native/ompdesk/crates/tauri-shell/tests/preload.ts
          bun native/ompdesk/crates/tauri-shell/tests/profile-preload.ts
      - name: Test the original Local Storage exporter without CEF
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/ompdesk/crates/tauri-shell/target
        run: cargo test --locked --manifest-path native/ompdesk/crates/shell/Cargo.toml --no-default-features --lib migrate::local_storage::tests
      - name: Test the Preview pipe and lifecycle unit
        shell: bash
        run: cargo test --locked --manifest-path native/ompdesk/crates/shell-preview/Cargo.toml --lib
      - name: Exercise the actual Preview browser consumer
        shell: bash
        run: |
          set -euo pipefail
          bunx --no-install playwright install chromium
          browser=$(bun -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          mkdir -p "$RUNNER_TEMP/preview-browser-fixture"
          OMPDESK_PREVIEW_TEST_BROWSER="$browser" \
          OMPDESK_PREVIEW_TEST_SCRATCH="$RUNNER_TEMP/preview-browser-fixture" \
            cargo test --locked --manifest-path native/ompdesk/crates/shell-preview/Cargo.toml --test browser -- --ignored --exact real_chromium_preview
      - name: Check the native host
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/ompdesk/crates/tauri-shell/Cargo.toml -- --check
          cargo clippy --locked --manifest-path native/ompdesk/crates/tauri-shell/Cargo.toml --all-targets -- -D warnings
      - name: Check the Preview consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/ompdesk/crates/shell-preview/Cargo.toml -- --check
          cargo clippy --locked --manifest-path native/ompdesk/crates/shell-preview/Cargo.toml --all-targets -- -D warnings
      - name: Refuse an active CEF dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path native/ompdesk/crates/tauri-shell/Cargo.toml --edges normal --prefix none --format '{p}' > tauri-dependencies.txt
          if grep -E '^cef(-| )|^cef_dll_sys ' tauri-dependencies.txt; then
            echo "::error::The system-WebView host still links CEF"
            exit 1
          fi
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # OMPdesk's own Rust (native/ompdesk) on every OS it ships or tests on: fmt
  # (Linux), clippy with warnings denied and `cargo test`, as ci.yml's `native`
  # (.github/actions/native-check). Much of the core is platform code that only
  # its own OS compiles and runs.
  native:
    name: native (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/native-check
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The vitest files that drive the real ompdesk-core binary, on macOS, where
  # no other job runs vitest (.github/actions/native-parity), as ci.yml's
  # `mac-native`.
  mac-native:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Stages resources/ompdesk-bin (built on a cache miss), which the tests' core process runs.
      - uses: ./.github/actions/install
      # session-index.test.ts reads stock omp's session storage.
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - uses: ./.github/actions/native-parity
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Package build's out/ for Windows, then the @smoke e2e on the fake omp
  # against that package: setup takeover, split select,
  # auto-resume after a kill and a quit, Model roles, the Changes commit, the
  # Files edit, Preview, Mica and close-to-tray, a new window's theme,
  # steering a running turn from the composer.
  win:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # lists this run's artifacts and jobs while `build` runs; the failure report reads the jobs
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # bun's cache on the workspace volume (D:) instead of the profile on C:,
      # so install never crosses volumes: 60-86 s became 28-41 s. Restoring it
      # with actions/cache measured no faster (17 s restore + 18 s install) and
      # its upload costs 42 s after every lockfile change, so it starts empty.
      # (On Linux a cold install takes 3-10 s; a restored cache saved nothing.)
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      # The Electron binary is needed here (gpu-fallback and sidecar tests import electron, whose
      # index.js throws without it): the shared install fetches it from a cache.
      - uses: ./.github/actions/install
        with:
          builder: "true"
      # The Tauri host (system WebView), the pinned Node for the package (the tauri-shell action: a cached build).
      - uses: ./.github/actions/tauri-shell
      # The pinned, signed Brave runtime Preview browses with (resources/preview-browser.json); packaging verifies it.
      - name: Stage the Preview browser
        run: bun scripts/stage-preview-browser.ts
      # The memory binary, built or restored from its cache and checked, as in the mac job.
      - id: memory-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ai-memory-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/memory/**', 'scripts/build-memory.ts', 'resources/gui-bridge/memory-prompt.ts', 'resources/gui-bridge/redactor.ts') }}
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native/memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        name: Build the memory binary
        run: bun run build:memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ${{ steps.memory-cache.outputs.cache-primary-key }}
      - if: steps.memory-cache.outputs.cache-hit == 'true'
        name: Check the cached memory binary
        run: bun run build:memory -- --check
      - name: Unpack the pinned agent-desktop
        run: bun run build:agent-desktop
      # `build` uploads out/ about when this install ends; `needs: build`
      # would instead start this job only once the build job is done too.
      - name: Wait for out/ from the build job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fetch-out.sh
      # The NSIS payload is a 7z that electron-builder packs at -mx=9 whatever
      # `compression:` says (`normal` and `maximum` are both 9); that single
      # LZMA2 pass took 61 s of this job on 2 cores. Level 4 takes about 27 s
      # for a setup about a quarter larger (the 7z of v0.32.1's app: 80 MB at
      # 9, 100 MB at 4; level 5-7 cost as much time as 9).
      - name: Package
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "4"
        run: bunx electron-builder --config electron-builder.win.yml --win --x64 --publish never
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/win-unpacked/resources/gui-bridge/index.ts
          # The Tauri host is OMPdesk.exe (electron-builder renamed the recorded ompdesk-shell.exe); the system's
          # WebView2 is the engine, so no CEF runtime or notices travel with it. Node runs the main from a plain app folder.
          REC=dist/win-unpacked/ompdesk-tauri.build.json
          test "$(jq -r .engine "$REC")" = tauri
          test "$(jq -r .platform "$REC")" = win32
          test "$(jq -r .binary "$REC")" = ompdesk-shell.exe
          test -f dist/win-unpacked/OMPdesk.exe
          test ! -e dist/win-unpacked/libcef.dll
          test ! -e dist/win-unpacked/resources/LICENSES.chromium.html
          test ! -e dist/win-unpacked/resources/LICENSE.cef.txt
          dist/win-unpacked/resources/node/node.exe --version | grep -Fx "v$(jq -r .version scripts/node-runtime-pin.json)"
          test -f dist/win-unpacked/resources/app/out/main/index.js
          test -f dist/win-unpacked/resources/app/out/preload/tauri.js
          test ! -e dist/win-unpacked/resources/app/out/preload/shell.js
          test ! -e dist/win-unpacked/resources/app.asar
          # Preview's own browser runtime (resources/preview-browser.json, bun scripts/stage-preview-browser.ts): its record
          # and the executable it names are in the package.
          PB=dist/win-unpacked/resources/preview-browser
          test -f "$PB/runtime.json"
          test -f "$PB/$(jq -er .binary "$PB/runtime.json")"
          AIM=dist/win-unpacked/resources/ai-memory-bin/ai-memory.exe
          test -f "$AIM"
          "$AIM" --version | grep -F "$(jq -r .version native/memory/ompdesk.json)"
          ADT=dist/win-unpacked/resources/agent-desktop-bin/agent-desktop.exe
          "$ADT" --version | grep -Fx "agent-desktop $(jq -r .version scripts/agent-desktop-pin.json)"
          # OMPdesk's own Rust (native/ompdesk): the CLI runs.
          dist/win-unpacked/resources/ompdesk-bin/ompdesk.exe help | grep -F "Exit codes"
          dist/win-unpacked/resources/ompdesk-bin/ompdesk-core.exe < /dev/null | grep -F '"event":"ready"'
      # Playwright cannot drive WebView2 either: the packaged win-unpacked app, driven through the test-only native
      # WebDriver on the fake omp (bridge, new tab, a prompt round trip, settings, a clean quit).
      - name: Smoke the packaged Tauri app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(cygpath -m "$PWD/dist/win-unpacked")
          mkdir -p "$RUNNER_TEMP/tauri-smoke"
          export OMPDESK_TAURI_TEST_BINARY="$APP/OMPdesk.exe"
          export OMPDESK_TAURI_TEST_OUTPUT=$(cygpath -m "$RUNNER_TEMP/tauri-smoke")
          export OMPDESK_TAURI_TEST_NODE="$APP/resources/node/node.exe"
          export OMP_GUI_E2E_OUT="$APP/resources/app/out"
          bun scripts/tauri-native-smoke.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-smoke-windows
          path: ${{ runner.temp }}/tauri-smoke/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-setup.exe" release/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest.yml release/
            sed -n 's/^ *- url: //p' dist/latest.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-setup.exe"
          fi
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-win
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs when prepare, build, static, check (every vitest job), win-platform (every shard), native (every OS),
  # tauri (Windows and macOS), mac-native, mac (packaged Tauri smoke) and win (packaged Tauri smoke) succeeded (the job `if` keeps GitHub's
  # implicit success(), so a failed or skipped need stops it). The full
  # Playwright suite is not part of a release: e2e-nightly.yml runs it
  # informationally. The pre-flight in ci.yml and local `bun run gate` are the
  # other proofs.
  publish:
    needs: [prepare, build, static, check, mac, win-platform, native, tauri, mac-native, win]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # the failure report reads this run's jobs
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts/ci-failure.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ompdesk-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: notes
      - name: Check assets
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/ompdesk-mac-arm64.dmg
          test -f dist/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" != "true" ]; then
            ASSETS=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ')
            if [ "$ASSETS" != "ompdesk-mac-arm64.dmg ompdesk-windows-setup.exe" ]; then
              echo "::error::A release carries exactly two assets; got: $ASSETS"
              exit 1
            fi
          fi
      # Version, size and SHA-512 (base64, as electron-updater writes it) of the
      # two installers, for the in-app updater (src/main/update-release.ts). An
      # HTML comment: GitHub does not render it.
      - name: Append update metadata
        run: |
          set -euo pipefail
          entry() {
            jq -n --arg name "$1" \
              --argjson size "$(wc -c < "dist/$1" | tr -d ' ')" \
              --arg sha512 "$(openssl dgst -sha512 -binary "dist/$1" | base64 | tr -d '\n')" \
              '{name: $name, size: $size, sha512: $sha512}'
          }
          minimumDarwin=$(jq -er .minimumDarwin src/shared/app-compatibility.json)
          META=$(jq -cn --arg version "$VERSION" --arg releaseDate "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson mac "$(entry ompdesk-mac-arm64.dmg | jq --arg minimum "$minimumDarwin" '. + {minimumSystemVersion: $minimum}')" \
            --argjson windows "$(entry ompdesk-windows-setup.exe)" \
            '{version: $version, releaseDate: $releaseDate, files: {mac: $mac, windows: $windows}}')
          printf '\n<!-- ompdesk-update %s -->\n' "$META" >> notes/notes.md
          cat notes/notes.md
      - name: Create tag and release
        if: inputs.dry_run != true
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes/notes.md dist/*
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
