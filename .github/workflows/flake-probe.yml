# One test file run many times on GitHub's runners, to catch a flaky test without a hand-made probe branch
# (copied cases, added delays). `bun run flake <spec> --ci [--grep <regex>] [--repeat <n>] [--os <os>]` dispatches
# it on the current pushed branch and prints the run's URL; scripts/flake.ts does the work here as it does on a
# developer's machine: Playwright `--repeat-each` for an e2e spec (after `bun run build`), `n` separate `vitest run`s
# for a vitest file (vitest 3 has no repeat flag), retries off, every repeat run to the end. Each OS's job summary
# holds its passes and failures, the failures per test and the first failure's message. See
# .omp/rules/e2e-ci-windows.md › Flaky tests.
#
# Its own workflow, not a ci.yml input: ci.yml's pre-flight jobs run on every dispatch, and its per-ref
# concurrency would cancel a probe on the next push (or one probe the next). Manual only; inputs reach the
# shell through `env`, never inline.
#
# The macOS leg is the account's scarcest runner: it needs the queue gate's admission (main or a MAC_REFS branch) and
# runs in the account-wide `mac-dispatch` lane. It exists for vitest files only: an e2e spec drives the app through
# Playwright, which cannot attach to macOS's WKWebView, so `--os all` runs an e2e spec on Windows alone and `--os macos`
# fails it at once (macOS's app check is scripts/tauri-native-smoke.ts, in mac-checks.yml). A probe is meant to be
# repeated, so no green run of the same name cancels a new one; an identical dispatch waits for the one running, and a
# third replaces the waiting one. See .omp/rules/e2e-ci-windows.md › CI › The check queue.
name: flake-probe
run-name: "flake ${{ inputs.spec }} ×${{ inputs.repeat }} (${{ inputs.os }})"

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Test file: an e2e spec (e2e/*.e2e.ts) or a vitest file"
        type: string
        required: true
      grep:
        description: "Only the tests whose title matches (Playwright --grep, vitest -t)"
        type: string
        default: ""
      repeat:
        description: "Times each test runs"
        type: number
        default: 10
      os:
        description: "Runners (an e2e spec runs on Windows only; all = macOS, Windows and Ubuntu for a vitest file, Windows for an e2e spec)"
        type: choice
        options: [all, macos, windows, ubuntu]
        default: all

permissions:
  contents: read

concurrency:
  group: flake-probe-${{ github.ref }}-${{ inputs.spec }}-${{ inputs.grep }}-${{ inputs.repeat }}-${{ inputs.os }}
  cancel-in-progress: false

jobs:
  # The queue's admission point (queue-gate.yml); a probe is repeated on purpose, so it never cancels as a duplicate.
  gate:
    permissions:
      contents: read
      actions: write # the gate's job may cancel a duplicate run; dedupe is off here
    uses: ./.github/workflows/queue-gate.yml
    with:
      workflow: flake-probe.yml
      mac: ${{ inputs.os == 'macos' || (inputs.os == 'all' && !endsWith(inputs.spec, '.e2e.ts')) }}
      mac-refs: ${{ vars.MAC_REFS }}
      dedupe: false

  probe:
    name: probe (${{ matrix.os }})
    needs: gate
    if: ${{ !cancelled() && (inputs.os != 'macos' || needs.gate.outputs.mac_ok == 'true') }}
    concurrency:
      group: ${{ matrix.os == 'macos' && 'mac-dispatch' || format('flake-probe-{0}-{1}', github.run_id, matrix.os) }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('[{0}]', inputs.os != 'all' && format('"{0}"', inputs.os) || format('{0}"windows"{1}', (needs.gate.outputs.mac_ok == 'true' && !endsWith(inputs.spec, '.e2e.ts')) && '"macos",' || '', !endsWith(inputs.spec, '.e2e.ts') && ',"ubuntu"' || ''))) }}
    defaults:
      run:
        shell: bash
    env:
      SPEC: ${{ inputs.spec }}
      GREP: ${{ inputs.grep }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'macOS' && endsWith(inputs.spec, '.e2e.ts')
        run: |
          echo "::error::An e2e spec cannot run on macOS: Playwright cannot attach to WKWebView. Probe it with --os windows; macOS's app check is scripts/tauri-native-smoke.ts."
          exit 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - if: runner.os == 'Windows'
        name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      # Tests import electron and e2e launches it: the shared install fetches the binary.
      - uses: ./.github/actions/install
      # An e2e spec launches the Tauri host (WebView2) and the pinned Node (the tauri-shell action: a cached build),
      # built with test-automation: only that build leaves WebView2's DevTools port open for Playwright.
      - if: endsWith(inputs.spec, '.e2e.ts')
        uses: ./.github/actions/tauri-shell
        with:
          test-automation: "true"
      # The unpackaged host finds Preview's browser under resources/preview-browser/<platform>-<arch>.
      - if: endsWith(inputs.spec, '.e2e.ts')
        name: Stage the Preview browser
        run: bun scripts/stage-preview-browser.ts
      # As ci.yml's check: the stock suites skip without omp, real-core launches it.
      - uses: ./.github/actions/install-omp
      - name: Repeat the spec
        run: bun scripts/flake.ts "$SPEC" --repeat "$REPEAT" ${GREP:+--grep "$GREP"}
      - if: ${{ !cancelled() && endsWith(inputs.spec, '.e2e.ts') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
